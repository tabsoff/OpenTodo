name: Tabsoff staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [tabsoff]

permissions:
  contents: read
  packages: read

concurrency:
  group: tabsoff-server-release-v2
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.repository == 'tabsoff/OpenTodo' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rehearse migrations and deploy isolated test instance
        env:
          RELEASE_ACTION: stage
          RELEASE_IMAGE: ""
          RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_KEY: ${{ secrets.OPENTODO_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.OPENTODO_DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/tabsoff/client.py
